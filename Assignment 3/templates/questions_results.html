<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
</head>
<body>
    {% if is_correct %}
        <h2 style="color: green;">Correct!</h2>
    {% else %}
        <h2 style="color: red;">Incorrect</h2>
        <p>The correct answer was: {{ correct_answer }}</p>
    {% endif %}
    
    <p>Question: {{ question }}</p>
    <p>Your Answer: {{ user_answer }}</p>
    
    <a href="/quiz"><button>Next Question</button></a>
</body>
</html>
